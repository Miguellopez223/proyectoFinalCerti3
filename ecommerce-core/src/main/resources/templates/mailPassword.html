<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta name="viewport" content="width=device-width"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>UPB</title>
    <style>
        img { border: none; max-width: 100%; }
        body {
            background-color: #f6f6f6;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            padding: 0;
        }
        table { border-collapse: separate; width: 100%; }
        table td { font-family: Arial, Helvetica, sans-serif; font-size: 14px; vertical-align: top; }
        .body { background: linear-gradient(180deg, #002855 0%, #004A99 100%); width: 100%; }
        .container { display: block; margin: 0 auto !important; max-width: 580px; padding: 10px; width: 580px; }
        .content { box-sizing: border-box; display: block; margin: 0 auto; max-width: 580px; padding: 10px; }
        .main { background: #ffffff; border-radius: 8px; width: 100%; }
        .wrapper { box-sizing: border-box; padding: 20px; }
        p, div, a { color: #1c1c1c; font-size: 14px; font-weight: normal; margin: 0 0 15px; text-align: center; }
        .password { text-align: left; }
        .password span { font-size: 1.5em; }
        .footer-text { color: #a1a2b2; font-size: 14px; margin: 0; text-align: center; }
        .footer-link { color: #a1a2b2; text-decoration: none; }
        .social-icon { max-width: 35px; height: auto; }
        .logo { max-width: 120px; margin-top: 3%; height: auto; }
        .divider { background-color: #e0e0e0; height: 1px; margin: 20px 0; }
        .preheader {
            color: transparent;
            display: none;
            height: 0;
            max-height: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            visibility: hidden;
            width: 0;
        }
        @media only screen and (max-width: 620px) {
            table[class=body] .wrapper { padding: 10px !important; }
            table[class=body] .content { padding: 0 !important; }
            table[class=body] .container { padding: 0 !important; width: 100% !important; }
            table[class=body] .main { border-radius: 0 !important; }
            table[class=body] p,
            table[class=body] div,
            table[class=body] a,
            table[class=body] td,
            table[class=body] span { font-size: 16px !important; }
        }
    </style>
</head>
<body>
<span class="preheader">UPB</span>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" class="body">
    <tr>
        <td>&nbsp;</td>
        <td class="container">
            <div class="content">
                <table role="presentation" class="main">
                    <tr>
                        <td class="wrapper">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td>
                                        <img th:src="|cid:${imageResourceName}|" alt="Logo" class="logo"/>
                                        <br/>
                                        <div>Bienvenido a la plataforma</div>
                                        <p>Tu contrasena temporal para la <b>Consola UPB</b> ha sido creada. Recuerda modificarla al iniciar sesion por primera vez.</p>
                                        <br/>
                                        <p class="password">Contrasena: <b><span th:text="${password}">Abc</span></b></p>
                                        <div class="divider"></div>

                                        <table width="100%" cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td width="50%" align="center">
                                                    <a href="https://x.com/upb_edu" target="_blank">
                                                        <img th:src="|cid:${imageX}|" alt="X" title="X" class="social-icon" border="0"/>
                                                    </a>
                                                </td>
                                                <td width="50%" align="center">
                                                    <a href="https://linkedin.com/school/universidad-privada-boliviana" target="_blank">
                                                        <img th:src="|cid:${imageLinkedin}|" title="LinkedIn" alt="LinkedIn" class="social-icon" border="0"/>
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>

                                        <table>
                                            <tr>
                                                <td>
                                                    <p class="footer-text">
                                                        <strong>
                                                            <a href="https://www.upb.edu" class="footer-link" target="_blank">Acerca de</a>
                                                            <a href="https://api.whatsapp.com/send?phone=59163608144" class="footer-link" target="_blank">Contactanos</a>
                                                        </strong>
                                                    </p>
                                                    <p class="footer-text">Universidad Privada Boliviana.<br/>Santa Cruz de la Sierra, Bolivia.</p>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
        <td>&nbsp;</td>
    </tr>
</table>
</body>
</html>
