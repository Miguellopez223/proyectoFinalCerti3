<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Notificación</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:30px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;">
                <!-- Header -->
                <tr>
                    <td style="background-color:#1a56db;padding:24px 32px;">
                        <p style="margin:0;color:#ffffff;font-size:24px;font-weight:bold;letter-spacing:-0.3px;">Tienda en Línea</p>
                    </td>
                </tr>
                <!-- Body -->
                <tr>
                    <td style="padding:32px;">
                        <p th:text="${message}"
                           style="margin:0;font-size:14px;color:#444444;line-height:1.7;"></p>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="background-color:#f9f9f9;padding:16px 32px;border-top:1px solid #eeeeee;">
                        <p style="margin:0;font-size:12px;color:#999999;">
                            Este mensaje fue generado automáticamente. Por favor no respondas a este correo.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
