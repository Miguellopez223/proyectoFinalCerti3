spring.application.name=ecommerce

# Puerto del servidor
server.port=8081

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgre
spring.datasource.password=210306
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA — validate porque el schema ya existe (creado con el .backup)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — clave secreta en Base64 (mínimo 256 bits). Cambiar en producción.
security.jwt.token.secret-key=ZWNvbW1lcmNlU2VjcmV0S2V5MjAyNVVQQkNlcnRpZmljYWNpb24=
# Tiempo de expiración en MINUTOS (480 = 8 horas)
security.jwt.token.expire-length=480
