spring.application.name=ecommerce

# Puerto del servidor
server.port=8081

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerceUPB
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA - update: Hibernate crea/agrega las tablas y columnas nuevas al arrancar
# (dashboard, reportes, unidades de medida, catalogo publico). Las columnas nuevas se
# declaran nullable para no romper las filas ya existentes creadas con el .backup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Respuestas de error estandarizadas (RFC 7807 - Problem Details). Hace que tambien los
# errores propios del framework (404 de ruta inexistente, 405, etc.) salgan en el mismo
# formato JSON que usa el GlobalExceptionHandler.
spring.mvc.problem-details.enabled=true

# JWT - clave secreta en Base64 (minimo 256 bits).
security.jwt.token.secret-key=ZWNvbW1lcmNlU2VjcmV0S2V5MjAyNVVQQkNlcnRpZmljYWNpb24=
# Tiempo de expiracion en MINUTOS (480 = 8 horas)
security.jwt.token.expire-length=480

# Sistema externo - backend del otro proyecto ecommerce que consumimos via RestClient
sistema.externo.url-base=http://localhost:8081
# Timeouts en milisegundos
sistema.externo.connect-timeout=2000
sistema.externo.read-timeout=5000

# Stereum - API de pagos (QR). Solo se usa el API Key ID en el header x-api-key.
stereum.url-base=https://api.stereum.tech
stereum.api-key=98ca7eb3-7ce4-4bcb-8785-21dd15de4477
# Timeouts en milisegundos (la generacion del QR puede tardar; read-timeout alto)
stereum.connect-timeout=5000
stereum.read-timeout=20000

# Correo (SMTP) — patron del docente: bean JavaMailSender propio (EmailSetting) + plantillas Thymeleaf.
# Las credenciales se leen de VARIABLES DE ENTORNO (no se hardcodean). Para Gmail:
#   1) Activa la verificacion en 2 pasos en tu cuenta de Google.
#   2) Crea una "Contrasena de aplicacion" de 16 caracteres (Seguridad -> Contrasenas de aplicaciones).
#   3) Define MAIL_SMTP_USERNAME = tu_correo@gmail.com  y  MAIL_SMTP_PASSWORD = esa contrasena de app.
# Mientras esten vacias el envio fallara, pero la app arranca igual (el bean se crea sin conectar).
mail.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.protocol=smtp
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.from-mail=${MAIL_SMTP_USERNAME:}
mail.smtp.mail-noreply=noreply@comercio1.com

# Datos usados por las plantillas de correo
app.tienda-nombre=Comercio1
app.url-frontend=http://localhost:5173

# Carrito abandonado: cuantas horas sin actividad para considerarlo abandonado
carrito.abandono.horas=1
# Cron del barrido (cada 8 horas: 00:00, 08:00, 16:00). Formato: seg min hora dia mes diaSemana
carrito.abandono.cron=0 0 */8 * * *

# Pool de hilos para los trabajadores @Async (envio de correos en paralelo)
async.core-pool-size=5
async.max-pool-size=5
async.queue-capacity=50
