spring.application.name=ecommerce

# Puerto del servidor
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce?currentSchema=public
spring.datasource.username=postgre
spring.datasource.password=210306
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT — clave secreta en Base64 (mínimo 256 bits). Cambiar en producción.
security.jwt.token.secret-key=ZWNvbW1lcmNlU2VjcmV0S2V5MjAyNVVQQkNlcnRpZmljYWNpb24=
# Tiempo de expiración en MINUTOS (480 = 8 horas)
security.jwt.token.expire-length=480
