spring.application.name=ecommerce

# Puerto del servidor
server.port=8081

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerceUPB
spring.datasource.username=postgres
spring.datasource.password=irdr151205
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA - update: Hibernate crea/agrega las tablas y columnas nuevas al arrancar
# (dashboard, reportes, unidades de medida, catalogo publico). Las columnas nuevas se
# declaran nullable para no romper las filas ya existentes creadas con el .backup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Respuestas de error estandarizadas (RFC 7807 - Problem Details). Hace que tambien los
# errores propios del framework (404 de ruta inexistente, 405, etc.) salgan en el mismo
# formato JSON que usa el GlobalExceptionHandler.
spring.mvc.problem-details.enabled=true

# JWT - clave secreta en Base64 (minimo 256 bits).
security.jwt.token.secret-key=ZWNvbW1lcmNlU2VjcmV0S2V5MjAyNVVQQkNlcnRpZmljYWNpb24=
# Tiempo de expiracion en MINUTOS (480 = 8 horas)
security.jwt.token.expire-length=480

# Sistema externo - backend del otro proyecto ecommerce que consumimos via RestClient
sistema.externo.url-base=http://localhost:8081
# Timeouts en milisegundos
sistema.externo.connect-timeout=2000
sistema.externo.read-timeout=5000

# Stereum - API de pagos (QR). Solo se usa el API Key ID en el header x-api-key.
stereum.url-base=https://api.stereum.tech
stereum.api-key=98ca7eb3-7ce4-4bcb-8785-21dd15de4477
# Timeouts en milisegundos (la generacion del QR puede tardar; read-timeout alto)
stereum.connect-timeout=5000
stereum.read-timeout=20000

# Correo (SMTP) para el recordatorio de carrito abandonado.
# Ejemplo con Gmail: username = tu correo, password = una "Contrasena de aplicacion" (no la normal).
# Mientras username/password esten vacios el envio fallara, pero el barrido igual marca el carrito
# como ABANDONADO (el error de correo se captura y solo se registra en el log).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Carrito abandonado: cuantas horas sin actividad para considerarlo abandonado
carrito.abandono.horas=1
# Cron del barrido (cada 8 horas: 00:00, 08:00, 16:00). Formato: seg min hora dia mes diaSemana
carrito.abandono.cron=0 0 */8 * * *

# Pool de hilos para los trabajadores @Async (envio de correos en paralelo)
async.core-pool-size=5
async.max-pool-size=5
async.queue-capacity=50

mail.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.protocol=smtp
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.from-mail=${MAIL_SMTP_USERNAME:}
mail.smtp.mail-noreply=noreply@gmail.com

####################################
# Quartz Scheduler
####################################
# Cambiar el tipo de almacenamiento de memoria a base de datos
spring.quartz.job-store-type=jdbc
# IMPORTANTE: Cambiar a 'always' la primera vez para crear las tablas automaticamente,
# luego volver a 'never' para produccion.
spring.quartz.jdbc.initialize-schema=never
# Comportamiento general del Scheduler
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.overwrite-existing-jobs=true
# Nombre e ID del scheduler (AUTO genera un ID unico por nodo en cluster)
spring.quartz.properties.org.quartz.scheduler.instanceName=EcommerceScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
# Configuracion para entornos en Cluster (Alta disponibilidad)
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
# Configuracion del pool de hilos (separado del pool @Async de carritos)
spring.quartz.properties.org.quartz.threadPool.threadCount=20
# Delegado JDBC especifico para PostgreSQL
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

####################################
# Spring Boot Actuator
####################################
# Endpoints expuestos via HTTP
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks,quartz,loggers,threaddump
# Mostrar detalles completos de cada componente de salud (DB, disco, mail, Quartz, custom)
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# Habilitar probes de liveness/readiness (utiles para contenedores)
management.endpoint.health.probes.enabled=true
# Informacion del sistema en /actuator/info
management.info.java.enabled=true
management.info.os.enabled=true
management.info.env.enabled=true
# Metadatos de la aplicacion (aparecen en /actuator/info)
info.app.nombre=Ecommerce UPB
info.app.descripcion=API REST multi-tienda con pagos QR Stereum
info.app.version=1.0.0
info.app.equipo=UPB Certificacion 2025
