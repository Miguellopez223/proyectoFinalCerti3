spring.application.name=ecommerce

\
spring.config.import=optional:application-local.properties

# Puerto del servidor
server.port=8081

# Swagger / OpenAPI (springdoc). UI en /swagger-ui.html, JSON en /v3/api-docs.
# operations-sorter=method ordena los endpoints por verbo HTTP (GET, POST, ...).
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Configuracion de PostgreSQL
# Credenciales por VARIABLES DE ENTORNO (no se hardcodean ni se versionan).
# Cada desarrollador define DB_USERNAME y DB_PASSWORD en su entorno. Los valores
# tras los ':' son solo el fallback por defecto (usuario postgres, sin contrasena).
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerceUPB
spring.datasource.username=postgres
spring.datasource.password=irdr151205
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA - update: Hibernate crea/agrega las tablas y columnas nuevas al arrancar
# (dashboard, reportes, unidades de medida, catalogo publico). Las columnas nuevas se
# declaran nullable para no romper las filas ya existentes creadas con el .backup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Respuestas de error estandarizadas (RFC 7807 - Problem Details). Hace que tambien los
# errores propios del framework (404 de ruta inexistente, 405, etc.) salgan en el mismo
# formato JSON que usa el GlobalExceptionHandler.
spring.mvc.problem-details.enabled=true

# JWT - clave secreta en Base64 (minimo 256 bits).
security.jwt.token.secret-key=ZWNvbW1lcmNlU2VjcmV0S2V5MjAyNVVQQkNlcnRpZmljYWNpb24=
# Tiempo de expiracion en MINUTOS (480 = 8 horas)
security.jwt.token.expire-length=480

# Google Login - usa el mismo OAuth Client ID que configures en el frontend.
google.oauth.client-id=${GOOGLE_CLIENT_ID:921525415797-dbv55t80id7h4m5ek563bnbivqrc4v4r.apps.googleusercontent.com}

# Sistema externo - backend del otro proyecto ecommerce que consumimos via RestClient
sistema.externo.url-base=http://localhost:8081
# Timeouts en milisegundos
sistema.externo.connect-timeout=2000
sistema.externo.read-timeout=5000

# Stereum - API de pagos (QR). Se autentica con el API Key en el header x-api-key.
# Credenciales sensibles: definelas por variable de entorno (STEREUM_API_KEY, STEREUM_ACCOUNT_ID).
# Los valores tras ":" son solo defaults de desarrollo; en produccion usa las env vars.
stereum.url-base=${STEREUM_URL_BASE:https://api.stereum.tech}
stereum.api-key=${STEREUM_API_KEY:0b370ed6-7e86-4db3-bcba-313ee6f34e9b}
# account_id de la cuenta de cobro que entrega el administrador de Stereum (tu docente).
stereum.account-id=${STEREUM_ACCOUNT_ID:efd8122f-5508-40ab-b149-ddfc873a8bc0}
# Credenciales del callback de pago (Stereum las envia en username/password dentro del body).
# Se valida el username; la password queda vacia (no se exige) hasta tener la spec exacta de
# "Seguridad en Webhook" del manual. Para no exigir auth, deja STEREUM_WEBHOOK_USERNAME vacio.
stereum.webhook.username=${STEREUM_WEBHOOK_USERNAME:bisa.callback.test}
stereum.webhook.password=${STEREUM_WEBHOOK_PASSWORD:}
# Timeouts en milisegundos (la generacion del QR puede tardar; read-timeout alto)
stereum.connect-timeout=5000
stereum.read-timeout=20000

#####################################################################
# Subida de imagenes a S3 (imagenes de productos, banners de tienda).
# Bucket/region/URL no son secretos y van con valor por defecto aqui.
# Las CREDENCIALES (access-key/secret-key) NO se versionan: van en
# application-local.properties (ignorado por git) para desarrollo local, y en
# produccion las provee el ROL IAM de la instancia (Elastic Beanstalk), por eso
# aqui quedan vacias. Si necesitas subir imagenes en local, pide las llaves y
# ponlas en tu application-local.properties.
#####################################################################
app.uploads.s3.bucket=${UPLOADS_S3_BUCKET:ecommerce-upb-5aceee5b-uploads}
app.uploads.s3.region=${UPLOADS_S3_REGION:us-east-1}
app.uploads.s3.public-base-url=${UPLOADS_PUBLIC_BASE_URL:https://ecommerce-upb-5aceee5b-uploads.s3.us-east-1.amazonaws.com}
app.uploads.s3.access-key=${UPLOADS_S3_ACCESS_KEY:}
app.uploads.s3.secret-key=${UPLOADS_S3_SECRET_KEY:}
# Tamanio maximo por imagen que valida el servicio (5 MB)
app.uploads.max-file-size-bytes=5242880

# Limite de Spring para multipart. Por defecto es 1MB y rechazaria imagenes mas
# grandes ANTES de llegar al controlador; se sube para que coincida con el limite
# de la app (5MB por archivo, 10MB por request).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Correo (SMTP) — patron del docente: bean JavaMailSender propio (EmailSetting) + plantillas Thymeleaf.
# Las credenciales se leen de VARIABLES DE ENTORNO (no se hardcodean). Para Gmail:
#   1) Activa la verificacion en 2 pasos en tu cuenta de Google.
#   2) Crea una "Contrasena de aplicacion" de 16 caracteres (Seguridad -> Contrasenas de aplicaciones).
#   3) Define MAIL_SMTP_USERNAME = tu_correo@gmail.com  y  MAIL_SMTP_PASSWORD = esa contrasena de app.
# Mientras esten vacias el envio fallara, pero la app arranca igual (el bean se crea sin conectar).
mail.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.protocol=smtp
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.from-mail=${MAIL_SMTP_USERNAME:}
mail.smtp.mail-noreply=noreply@comercio1.com

# Datos usados por las plantillas de correo
app.tienda-nombre=Klikea
app.url-frontend=http://localhost:5173

# Carrito abandonado: cuantas horas sin actividad para considerarlo abandonado
carrito.abandono.horas=1
# El barrido ahora corre como job de Quartz (CarritoAbandonadoQuartzJob); su cron se
# configura mas abajo en job.carrito-abandonado.cron (formato Quartz, NO el de @Scheduled).

# Pool de hilos para los trabajadores @Async (envio de correos en paralelo)
async.core-pool-size=5
async.max-pool-size=5
async.queue-capacity=50

#####################################################################
# Cache (Caffeine) - en memoria. Config lista; @Cacheable AUN NO implementado.
# Falta: @EnableCaching y anotar los metodos de servicio de usuarios/productos.
#####################################################################
spring.cache.type=caffeine
spring.cache.cache-names=usuarios,productos,catalogo
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=500,expireAfterWrite=10m,recordStats

#####################################################################
# Actuator - monitoreo y diagnostico de la app
#
# SEGURIDAD: en SecurityConfig solo /actuator/health es publico; el resto
# (info, metrics, quartz, scheduledtasks, loggers) exige JWT. NUNCA exponer
# env ni heapdump publicamente: filtran el JWT secret, la clave de la BD y
# las credenciales de Gmail. Por eso aqui se listan los endpoints uno a uno
# (lista blanca) en vez de usar el comodin '*'.
#####################################################################
# Endpoints expuestos por HTTP (lista blanca explicita)
management.endpoints.web.exposure.include=health,info,metrics,quartz,scheduledtasks,loggers,caches
# Detalle del health solo para peticiones autenticadas (anonimo ve solo {status:UP})
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
# Indicadores de salud activos: BD, disco, ping, Quartz, correo
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.mail.enabled=true
# El endpoint de apagado (shutdown) queda totalmente inaccesible
management.endpoint.shutdown.access=none
# Contribuidores de /info: java, os y propiedades app.* de abajo
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

# Datos personalizados que aparecen en /actuator/info (@...@ los rellena Maven al compilar)
info.app.name=Ecommerce UPB
info.app.description=API REST de e-commerce con JWT, carrito, pedidos y pagos Stereum
info.app.version=@project.version@
info.app.equipo=UPB - Certificacion III

#####################################################################
# Quartz Scheduler (patron del docente, proyecto eventop)
# Jobs persistentes en la BD (sobreviven a reinicios y son programables en caliente
# vía JobService). El barrido de carritos abandonados ahora corre como job de Quartz.
#
# IMPORTANTE: las tablas qrtz_* deben existir ANTES de arrancar. Crearlas una sola vez
# ejecutando el script  script/quartz.sql  sobre la base de datos ecommerceUPB:
#   psql -U postgres -d ecommerceUPB -f script/quartz.sql
#####################################################################
# Almacenamiento de jobs en base de datos (no en memoria)
spring.quartz.job-store-type=jdbc
# El esquema (tablas qrtz_*) lo creamos a mano con script/quartz.sql, no Spring
spring.quartz.jdbc.initialize-schema=never
# Esperar a que los jobs en curso terminen al apagar la app
spring.quartz.wait-for-job-completion-on-shutdown=true
# Si se vuelve a registrar un job con el mismo nombre, se sobrescribe
spring.quartz.overwrite-existing-jobs=true
# Propiedades nativas de Quartz
spring.quartz.properties.org.quartz.scheduler.instanceName=ecommerceQuartzApp
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
# Una sola instancia (sin clúster) para desarrollo
spring.quartz.properties.org.quartz.jobStore.isClustered=false
# Guarda los datos del job como Strings (requiere los Persistable*TriggerFactoryBean)
spring.quartz.properties.org.quartz.jobStore.useProperties=true
spring.quartz.properties.org.quartz.jobStore.tablePrefix=qrtz_
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
# Pool de hilos propio de Quartz (cuántos jobs pueden correr en paralelo)
spring.quartz.properties.org.quartz.threadPool.threadCount=20

# Grupo y cron del job demostrativo de Quartz (ver NotificacionJob / QuartzJobInitializer)
job.notificacion.group=Ecommerce
# Cada minuto. Formato Quartz: seg min hora dia mes diaSemana (anio)
job.notificacion.cron=0 0/1 * * * ?

# Cron del barrido de carritos abandonados (CarritoAbandonadoQuartzJob).
# Cada 8 horas: 00:00, 08:00 y 16:00. Formato Quartz (ojo: dia-semana en '?', no '*').
job.carrito-abandonado.cron=0 0 0/8 * * ?
