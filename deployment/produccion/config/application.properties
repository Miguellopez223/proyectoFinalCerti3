spring.application.name=ecommerce

# Puerto del servidor
server.port=8082

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce?currentSchema=public
spring.datasource.username=CAMBIAR_USUARIO
spring.datasource.password=CAMBIAR_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public

spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT - reemplazar por una clave Base64 real
security.jwt.token.secret-key=CAMBIAR_SECRET_BASE64
security.jwt.token.expire-length=2
auth.login-window-minutes=2

auth-client.url-base=http://localhost:8082
auth-client.connect-timeout=10000
auth-client.read-timeout=40000

tienda-client.url-base=http://localhost:8082
tienda-client.connect-timeout=10000
tienda-client.read-timeout=40000

producto-client.url-base=http://localhost:8082
producto-client.connect-timeout=10000
producto-client.read-timeout=40000

stereum.url-base=https://api.stereum.tech
stereum.api-key=CAMBIAR_API_KEY
stereum.api-key-header=x-api-key
stereum.connect-timeout=10000
stereum.read-timeout=40000
stereum.mock-enabled=false

# Desactivar el smoke test al arrancar en despliegue
client-smoke-test.enabled=false
